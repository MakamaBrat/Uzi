<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поиск USB-устройства</title>
<style>
  :root {
    --bg: #f5f6f7; --panel: #ffffff; --text: #1d2125; --muted: #5d6670;
    --line: #d5dade; --accent: #0b6e8a; --ok: #1a7f4b; --warn: #a86400; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181b; --panel: #1c2226; --text: #e6e9ec; --muted: #9aa5ae;
      --line: #313a40; --accent: #5cc3df; --ok: #5fd08e; --warn: #f0b24d; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, "Segoe UI", Arial, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #0b1a20; } }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  input[type=text] { font: inherit; width: 90px; padding: 6px 8px; border-radius: 6px;
                     border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #status { font-weight: 600; margin: 0 0 8px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  pre { margin: 0; max-height: 360px; overflow: auto; font: 13px/1.45 ui-monospace, Consolas, monospace;
        white-space: pre-wrap; }
  h2 { font-size: 16px; margin: 0 0 10px; }
</style>
</head>
<body>
<main>
  <h1>Поиск USB-устройства</h1>
  <p class="sub">Показывает, видит ли браузер датчик, и что он о себе сообщает. Картинку страница не выводит.</p>

  <div class="panel">
    <p id="status">Проверяю браузер…</p>
    <div class="row">
      <button class="primary" id="btnFind">Найти устройство</button>
      <button id="btnAll">Показать все USB</button>
      <label>VID <input type="text" id="vid" value="04B4" maxlength="4"></label>
      <label>PID <input type="text" id="pid" value="00F1" maxlength="4"></label>
    </div>
  </div>

  <div class="panel" id="infoPanel" hidden>
    <h2>Устройство</h2>
    <dl id="info"></dl>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between; margin-bottom:8px">
      <h2 style="margin:0">Журнал</h2>
      <span class="row">
        <button id="btnCopy">Копировать</button>
        <button id="btnClear">Очистить</button>
      </span>
    </div>
    <pre id="log"></pre>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const logEl = $("log"), statusEl = $("status");
  const hex = (n, w = 4) => n.toString(16).toUpperCase().padStart(w, "0");
  const CLASSES = { 0x00: "по интерфейсам", 0x01: "аудио", 0x02: "связь", 0x03: "HID", 0x08: "накопитель",
                    0x0E: "видео (UVC)", 0xEF: "составное", 0xFE: "специальное", 0xFF: "производителя" };

  function log(msg, cls) {
    const t = new Date().toLocaleTimeString("ru-RU");
    const line = `[${t}] ${msg}\n`;
    logEl.appendChild(Object.assign(document.createElement("span"), { textContent: line, className: cls || "" }));
    logEl.scrollTop = logEl.scrollHeight;
    console.log("[USB]", msg);
  }
  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

  if (!("usb" in navigator)) {
    setStatus("WebUSB не поддерживается. Откройте страницу в Chrome или Edge по HTTPS.", "err");
    log("navigator.usb отсутствует. Нужен Chrome/Edge на компьютере; Firefox и Safari не подходят.", "err");
    $("btnFind").disabled = true; $("btnAll").disabled = true;
    return;
  }
  if (!window.isSecureContext) log("Страница не в защищённом контексте: WebUSB не заработает.", "err");
  setStatus("Готово. Подключите датчик и нажмите «Найти устройство».");
  log("WebUSB доступен.", "ok");

  function filters() {
    const v = parseInt($("vid").value, 16), p = parseInt($("pid").value, 16);
    const f = {};
    if (!Number.isNaN(v)) f.vendorId = v;
    if (!Number.isNaN(p) && !Number.isNaN(v)) f.productId = p;
    return Object.keys(f).length ? [f] : [];
  }

  function showInfo(dev) {
    const rows = [
      ["Название", dev.productName || "(не сообщает)"],
      ["Производитель", dev.manufacturerName || "(не сообщает)"],
      ["Серийный номер", dev.serialNumber || "(не сообщает)"],
      ["VID:PID", `${hex(dev.vendorId)}:${hex(dev.productId)}`],
      ["Версия USB", `${dev.usbVersionMajor}.${dev.usbVersionMinor}`],
      ["Класс устройства", `0x${hex(dev.deviceClass, 2)} (${CLASSES[dev.deviceClass] || "?"})`],
      ["Состояние", dev.opened ? "открыто" : "закрыто"],
    ];
    const dl = $("info"); dl.textContent = "";
    for (const [k, v] of rows) {
      dl.appendChild(Object.assign(document.createElement("dt"), { textContent: k }));
      dl.appendChild(Object.assign(document.createElement("dd"), { textContent: v }));
    }
    $("infoPanel").hidden = false;
  }

  function describeConfig(dev) {
    for (const cfg of dev.configurations) {
      log(`Конфигурация ${cfg.configurationValue}: интерфейсов ${cfg.interfaces.length}`);
      for (const itf of cfg.interfaces) {
        for (const alt of itf.alternates) {
          log(`  интерфейс ${itf.interfaceNumber}, alt ${alt.alternateSetting}: класс 0x${hex(alt.interfaceClass, 2)} (${CLASSES[alt.interfaceClass] || "?"})`);
          for (const ep of alt.endpoints) {
            log(`    endpoint ${ep.endpointNumber} ${ep.direction === "in" ? "IN " : "OUT"} ${ep.type}, пакет ${ep.packetSize}`);
          }
        }
      }
    }
  }

  async function inspect(dev) {
    log(`Найдено: ${hex(dev.vendorId)}:${hex(dev.productId)} ${dev.productName || ""}`, "ok");
    try {
      await dev.open();
      if (dev.configuration === null && dev.configurations.length) await dev.selectConfiguration(1);
      showInfo(dev);
      describeConfig(dev);
      setStatus(`Устройство видно: ${dev.productName || hex(dev.vendorId) + ":" + hex(dev.productId)}`, "ok");
      await dev.close();
    } catch (e) {
      showInfo(dev);
      log(`Не удалось открыть: ${e.name}: ${e.message}`, "err");
      if (e.name === "SecurityError" || /access denied/i.test(e.message)) {
        log("Доступ закрыт. Устройству нужен драйвер WinUSB (Zadig → WinUSB → Replace Driver) и закрытая остальная программа, которая его использует.", "warn");
      }
      setStatus("Устройство найдено, но открыть его не удалось. Подробности в журнале.", "warn");
    }
  }

  async function pick(useFilters) {
    try {
      const dev = await navigator.usb.requestDevice({ filters: useFilters ? filters() : [] });
      await inspect(dev);
    } catch (e) {
      if (e.name === "NotFoundError") {
        setStatus("Устройство не выбрано или не найдено.", "warn");
        log("Окно выбора закрыто или список пуст. Если список пуст: проверьте кабель, порт USB 3.0 и драйвер WinUSB.", "warn");
      } else {
        setStatus("Ошибка: " + e.name, "err");
        log(`${e.name}: ${e.message}`, "err");
      }
    }
  }

  $("btnFind").onclick = () => pick(true);
  $("btnAll").onclick = () => pick(false);
  $("btnClear").onclick = () => { logEl.textContent = ""; };
  $("btnCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(logEl.textContent); log("Журнал скопирован.", "ok"); }
    catch { log("Не удалось скопировать.", "err"); }
  };

  navigator.usb.addEventListener("connect", e => {
    log(`Подключено: ${hex(e.device.vendorId)}:${hex(e.device.productId)}`, "ok");
    inspect(e.device);
  });
  navigator.usb.addEventListener("disconnect", e => {
    log(`Отключено: ${hex(e.device.vendorId)}:${hex(e.device.productId)}`, "warn");
    setStatus("Устройство отключено.", "warn");
  });

  navigator.usb.getDevices().then(list => {
    if (list.length) { log(`Ранее разрешённых устройств: ${list.length}`); list.forEach(inspect); }
  });
})();
</script>
</body>
</html>

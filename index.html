<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chison USG Web</title>
<style>
:root{
  --bg:#f2f4f6; --panel:#ffffff; --line:#d5dbe1; --text:#14191e; --muted:#5d6b78;
  --accent:#0b7f94; --accent-ink:#ffffff; --danger:#b42318; --screen:#000;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1115; --panel:#151b21; --line:#27313b; --text:#e6ebf0; --muted:#8794a1;
    --accent:#4cc2d6; --accent-ink:#04171b; --danger:#ff8a7a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1115; --panel:#151b21; --line:#27313b; --text:#e6ebf0; --muted:#8794a1;
  --accent:#4cc2d6; --accent-ink:#04171b; --danger:#ff8a7a; color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit }
html{ scroll-padding-top:env(safe-area-inset-top,0px) }
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.app{ max-width:1200px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:minmax(0,1fr) 300px; align-items:start }
@media (max-width:820px){ .app{ grid-template-columns:minmax(0,1fr) } }
header{ grid-column:1/-1; display:flex; justify-content:space-between; align-items:baseline; gap:12px }
h1{ font-size:1.15rem; margin:0; font-weight:650 }
.sub{ color:var(--muted); font-size:.85rem }
.stage{ background:var(--screen); border:1px solid var(--line); border-radius:6px; position:relative; aspect-ratio:4/3; display:grid; place-items:center; overflow:hidden }
canvas{ max-width:100%; max-height:100%; display:block }
.empty{ position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:#9aa7b3; font-size:.95rem }
.hud{ position:absolute; left:10px; top:8px; font:12px/1.3 ui-monospace,Menlo,Consolas,monospace; color:#7ee0f0; text-shadow:0 0 3px #000 }
.rec{ position:absolute; right:12px; top:8px; display:none; align-items:center; gap:6px; color:#ff6b5c; font:600 12px system-ui }
.rec::before{ content:""; width:9px; height:9px; border-radius:50%; background:#ff6b5c }
.rec.on{ display:flex }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px; display:grid; gap:14px }
fieldset{ border:0; padding:0; margin:0; display:grid; gap:8px }
legend{ font-weight:600; font-size:.9rem; padding:0; margin-bottom:6px }
label{ display:grid; gap:4px; font-size:.85rem; color:var(--muted) }
label.row{ grid-template-columns:1fr auto; align-items:center }
select,button{ font:inherit }
select{ width:100%; padding:8px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--text) }
input[type=range]{ width:100%; accent-color:var(--accent) }
.btns{ display:grid; grid-template-columns:1fr 1fr; gap:8px }
button{ padding:9px 10px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--text); cursor:pointer }
button:hover:not(:disabled){ border-color:var(--accent) }
button:disabled{ opacity:.45; cursor:not-allowed }
button.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600 }
button.danger{ color:var(--danger); border-color:var(--danger) }
button.wide{ grid-column:1/-1 }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }
#status{ min-height:2.6em; font-size:.85rem; color:var(--muted) }
#status.err{ color:var(--danger) }
.note{ font-size:.78rem; color:var(--muted); grid-column:1/-1 }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Chison USG Web</h1>
    <span class="sub">USB-датчик в браузере</span>
  </header>

  <section>
    <div class="stage" id="stage">
      <canvas id="view" width="640" height="480" aria-label="Изображение с датчика"></canvas>
      <div class="empty" id="empty">Подключите датчик по USB и нажмите «Подключить».</div>
      <div class="hud" id="hud"></div>
      <div class="rec" id="rec">REC</div>
    </div>
  </section>

  <aside class="panel">
    <fieldset>
      <legend>Источник</legend>
      <label>Камера
        <select id="device"><option value="">Системная по умолчанию</option></select>
      </label>
      <div class="btns">
        <button id="connect" class="primary">Подключить</button>
        <button id="disconnect" disabled>Отключить</button>
      </div>
      <div id="status" role="status" aria-live="polite">Не подключено.</div>
    </fieldset>

    <fieldset>
      <legend>Изображение</legend>
      <label>Яркость <input id="bright" type="range" min="50" max="200" value="100"></label>
      <label>Контраст <input id="contrast" type="range" min="50" max="250" value="100"></label>
      <label class="row">Чёрно-белое <input id="gray" type="checkbox" checked></label>
      <label class="row">Отразить по горизонтали <input id="flipx" type="checkbox"></label>
      <label class="row">Отразить по вертикали <input id="flipy" type="checkbox"></label>
      <label>Поворот
        <select id="rot"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select>
      </label>
      <button id="reset">Сбросить настройки</button>
    </fieldset>

    <fieldset>
      <legend>Сохранение</legend>
      <div class="btns">
        <button id="snap" disabled>Сделать снимок</button>
        <button id="recbtn" disabled>Начать запись</button>
      </div>
    </fieldset>
  </aside>

  <p class="note">Видео обрабатывается только в вашем браузере и никуда не отправляется. Приложение не сертифицировано и не предназначено для медицинской диагностики.</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $("view"), ctx = canvas.getContext("2d", { willReadFrequently: false });
  const video = document.createElement("video");
  video.muted = true; video.playsInline = true;
  const hasCtxFilter = "filter" in ctx;

  let stream = null, rafId = 0, recorder = null, chunks = [];
  let frames = 0, fps = 0, tFps = performance.now();

  const setStatus = (msg, err = false) => { $("status").textContent = msg; $("status").classList.toggle("err", err); };
  const stamp = () => new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
  const download = (blob, name) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  async function refreshDevices() {
    if (!navigator.mediaDevices?.enumerateDevices) return;
    const keep = $("device").value;
    const list = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    const sel = $("device");
    sel.length = 1;
    list.forEach((d, i) => sel.add(new Option(d.label || `Камера ${i + 1}`, d.deviceId)));
    if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
  }

  function explain(e) {
    switch (e.name) {
      case "NotAllowedError": return "Доступ к камере запрещён. Разрешите его в настройках сайта в браузере.";
      case "NotFoundError": return "Камера не найдена. Проверьте USB-подключение датчика.";
      case "NotReadableError": return "Камера занята другой программой. Закройте её и повторите.";
      case "OverconstrainedError": return "Выбранная камера недоступна. Выберите другую.";
      default: return `Не удалось подключиться: ${e.message || e.name}`;
    }
  }

  async function connect() {
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus("Браузер не поддерживает доступ к камере или страница открыта не по HTTPS.", true);
      return;
    }
    disconnect(true);
    const id = $("device").value;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: id ? { deviceId: { exact: id }, width: { ideal: 1280 }, height: { ideal: 720 } }
                  : { width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (e) { setStatus(explain(e), true); return; }

    const track = stream.getVideoTracks()[0];
    track.addEventListener("ended", () => { setStatus("Датчик отключён.", true); disconnect(true); });
    video.srcObject = stream;
    try { await video.play(); } catch (e) { setStatus(explain(e), true); disconnect(true); return; }
    await refreshDevices();
    const cur = track.getSettings().deviceId; if (cur) $("device").value = cur;

    $("empty").style.display = "none";
    $("connect").disabled = true; $("disconnect").disabled = false;
    $("snap").disabled = false; $("recbtn").disabled = false;
    setStatus(`Подключено: ${track.label || "камера"}`);
    schedule();
  }

  function disconnect(silent) {
    if (recorder) stopRecording();
    cancelAnimationFrame(rafId); rafId = 0;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    $("empty").style.display = "";
    $("connect").disabled = false; $("disconnect").disabled = true;
    $("snap").disabled = true; $("recbtn").disabled = true;
    $("hud").textContent = "";
    if (!silent) setStatus("Отключено.");
  }

  function schedule() { rafId = requestAnimationFrame(draw); }

  function draw() {
    rafId = 0;
    if (!stream) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw && vh) {
      const rot = +$("rot").value, swap = rot === 90 || rot === 270;
      const cw = swap ? vh : vw, ch = swap ? vw : vh;
      if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }

      const b = +$("bright").value, c = +$("contrast").value, g = $("gray").checked;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cw, ch);
      ctx.translate(cw / 2, ch / 2);
      ctx.rotate(rot * Math.PI / 180);
      ctx.scale($("flipx").checked ? -1 : 1, $("flipy").checked ? -1 : 1);
      if (hasCtxFilter) ctx.filter = `${g ? "grayscale(1) " : ""}brightness(${b}%) contrast(${c}%)`;
      ctx.drawImage(video, -vw / 2, -vh / 2, vw, vh);
      ctx.restore();
      if (!hasCtxFilter) manualFilter(cw, ch, g, b / 100, c / 100); // Safari
      frames++;
    }
    const now = performance.now();
    if (now - tFps >= 1000) { fps = frames * 1000 / (now - tFps); frames = 0; tFps = now; }
    $("hud").textContent = `${canvas.width}×${canvas.height}  ${fps.toFixed(0)} fps`;
    schedule();
  }

  function manualFilter(w, h, gray, br, co) {
    const img = ctx.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i + 1], b = d[i + 2];
      if (gray) r = g = b = 0.299 * r + 0.587 * g + 0.114 * b;
      d[i]   = ((r * br - 128) * co) + 128;
      d[i+1] = ((g * br - 128) * co) + 128;
      d[i+2] = ((b * br - 128) * co) + 128;
    }
    ctx.putImageData(img, 0, 0);
  }

  function snapshot() {
    canvas.toBlob(b => b && download(b, `usg_${stamp()}.png`), "image/png");
  }

  function startRecording() {
    if (!window.MediaRecorder) { setStatus("Запись не поддерживается этим браузером.", true); return; }
    const type = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"]
      .find(t => MediaRecorder.isTypeSupported(t));
    try { recorder = new MediaRecorder(canvas.captureStream(30), type ? { mimeType: type } : undefined); }
    catch (e) { setStatus(`Не удалось начать запись: ${e.message}`, true); recorder = null; return; }
    chunks = [];
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    const mime = recorder.mimeType || "video/webm";
    recorder.onstop = () => {
      if (chunks.length) download(new Blob(chunks, { type: mime }), `usg_${stamp()}.${mime.includes("mp4") ? "mp4" : "webm"}`);
      chunks = [];
    };
    recorder.start(1000);
    $("rec").classList.add("on"); $("recbtn").textContent = "Остановить запись"; $("recbtn").classList.add("danger");
  }

  function stopRecording() {
    if (recorder && recorder.state !== "inactive") recorder.stop();
    recorder = null;
    $("rec").classList.remove("on"); $("recbtn").textContent = "Начать запись"; $("recbtn").classList.remove("danger");
  }

  function resetImage() {
    $("bright").value = 100; $("contrast").value = 100;
    $("gray").checked = true; $("flipx").checked = false; $("flipy").checked = false; $("rot").value = "0";
  }

  $("connect").onclick = connect;
  $("disconnect").onclick = () => disconnect(false);
  $("snap").onclick = snapshot;
  $("recbtn").onclick = () => recorder ? stopRecording() : startRecording();
  $("reset").onclick = resetImage;
  $("device").onchange = () => { if (stream) connect(); };
  navigator.mediaDevices?.addEventListener?.("devicechange", refreshDevices);
  window.addEventListener("pagehide", () => disconnect(true));
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "s" && stream) snapshot();
    if (e.key === "r" && stream) $("recbtn").click();
  });
  refreshDevices();
})();
</script>
</body>
</html>

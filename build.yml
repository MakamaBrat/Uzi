name: Build USG Viewer

# Сборка запускается при пуше в ветку main
# и вручную из вкладки Actions (кнопка "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name usg_viewer usg_viewer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usg_viewer-windows
          path: dist/usg_viewer.exe
